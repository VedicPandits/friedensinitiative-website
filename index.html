<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maharishi Vedic Pandits – Friedensinitiative</title>

    <!--
      Netlify Identity Widget:
      - Required so invited users can set their password.
      - When an invitee clicks the email link, they land here with a #invite_token=...
        hash. The widget below picks that up and shows the signup modal.
      - After login, redirect to /admin/ so they can edit content.
    -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function (user) {
          if (!user) {
            window.netlifyIdentity.on('login', function () {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static form for Netlify Forms detection.
      Netlify scans index.html at deploy time and registers any <form> with
      data-netlify="true". The React form below submits via fetch to '/' with
      the same name and field names, and Netlify routes the submission here.
      This form is hidden from users.
    -->
    <form
      name="contact"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
