# =============================================================================
# Netlify Configuration
# =============================================================================

[build]
  command  = "npm run build"
  publish  = "dist"

[build.environment]
  NODE_VERSION = "20"

# -----------------------------------------------------------------------------
# Redirects
# -----------------------------------------------------------------------------
# IMPORTANT: The /admin/* rule must come before the SPA fallback, otherwise
# Decap CMS gets rewritten to /index.html and breaks.

[[redirects]]
  from   = "/admin/*"
  to     = "/admin/:splat"
  status = 200

# SPA fallback — every non-static route serves index.html so React Router
# handles client-side routing.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# -----------------------------------------------------------------------------
# Security headers
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-XSS-Protection       = "1; mode=block"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

# Long cache for hashed assets — Vite gives them content hashes, so this is safe
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The admin panel should never be cached aggressively
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
