# =============================================================================
# Decap CMS Configuration
# =============================================================================
# Backend: Git Gateway (uses Netlify Identity for auth, commits to GitHub)
# Repo:    VedicPandits/friedensinitiative-website
# =============================================================================

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'CMS: Create {{collection}} "{{slug}}"'
    update: 'CMS: Update {{collection}} "{{slug}}"'
    delete: 'CMS: Delete {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: Upload "{{path}}"'
    deleteMedia: 'CMS: Delete "{{path}}"'

# Editorial workflow lets editors save drafts before publishing.
# Comment this out if you want all saves to publish immediately.
publish_mode: editorial_workflow

# Media uploads land in public/uploads and are served from /uploads
media_folder: public/uploads
public_folder: /uploads

# Logo and site URL (will display correctly once deployed)
site_url: https://friedensinitiative-website.netlify.app
display_url: https://friedensinitiative-website.netlify.app

# Show a friendly notice if config.yml has issues
locale: 'en'

# =============================================================================
# COLLECTIONS
# =============================================================================
# Strategy: ONE collection per language. Each collection edits exactly one
# locale JSON file (en.json / de.json / fr.json). This avoids merge conflicts
# that occur when multiple Decap "files" target the same source file.
# =============================================================================

collections:

