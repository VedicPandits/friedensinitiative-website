  # ---------------------------------------------------------------------------
  # MEDIA LIBRARY
  # ---------------------------------------------------------------------------
  # Browse and upload images. Files land in public/uploads and are referenced
  # from content via /uploads/<filename>.
  # ---------------------------------------------------------------------------
  - name: images
    label: '🖼️ Bilder / Images'
    description: 'Bilder hochladen und verwalten. Upload and manage images.'
    folder: 'public/uploads'
    create: true
    delete: true
    slug: '{{slug}}'
    extension: json
    format: json
    editor:
      preview: false
    fields:
      - { label: 'Title',       name: title,       widget: string }
      - { label: 'Image',       name: image,       widget: image }
      - { label: 'Alt text',    name: alt,         widget: string }
      - { label: 'Description', name: description, widget: text, required: false }
